name: Build Collection Reports Image

on:
  push:
    branches:
      - main
    paths:
      - 'reports/**'
      - 'src/reports/**'
      - 'src/collection/viz.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker/reports.Dockerfile'
      - '.github/workflows/docker-reports-build.yml'
  workflow_dispatch: {}

env:
  GCP_PROJECT_ID: bgg-predictive-models

jobs:
  build:
    name: Build and push reports image
    runs-on: ubuntu-latest
    environment: PROD

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          mkdir -p credentials
          echo '${{ secrets.GCP_SA_KEY_BGG_ML }}' > credentials/service-account-key.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BGG_ML }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud artifacts repositories create bgg-predictive-models \
            --repository-format=docker --location=us-central1 --quiet || true

      # The reports image is a stateless batch renderer (not a
      # prod/dev service), so it carries no environment tag — the
      # dev/prod data split happens at `docker run` time via the
      # --source gs://.../<env>/collections argument. Build FROM the
      # always-current collections:prod base; tag :latest (what the
      # render workflows pull) plus the commit sha (traceability /
      # rollback).
      - name: Pull base image
        run: |
          docker pull us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/collections:prod

      - name: Build Docker image
        run: |
          docker build -f docker/reports.Dockerfile \
            --build-arg BASE_IMAGE=us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/collections:prod \
            -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:latest \
            -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:latest
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:${{ github.sha }}
