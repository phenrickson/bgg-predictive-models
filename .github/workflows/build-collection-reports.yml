name: Build Collection Reports

on:
  schedule:
    # Sunday 09:00 UTC — after the weekly collection-scoring run.
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      users:
        description: 'Comma-separated usernames to render (blank = discover all)'
        required: false
        default: ''

env:
  GCP_PROJECT_ID: bgg-predictive-models

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Discover which users to render. Either the explicit list passed via
  # workflow_dispatch.inputs.users, or every user with finalized artifacts
  # under gs://<bucket>/<env>/collections/.
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
    outputs:
      users: ${{ steps.list.outputs.users }}
      env_name: ${{ steps.env.outputs.env_name }}
      image_tag: ${{ steps.env.outputs.image_tag }}

    steps:
      - name: Set environment name + image tag
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "image_tag=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "image_tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BGG_ML }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build user list
        id: list
        run: |
          set -e
          requested='${{ inputs.users }}'
          if [ -n "$requested" ]; then
            # Comma-separated → JSON array.
            users=$(echo "$requested" \
              | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' \
              | python3 -c "import sys, json; print(json.dumps([u.strip() for u in sys.stdin.read().split() if u.strip()]))")
          else
            # Discover by listing the gs:// prefix.
            users=$(gsutil ls "gs://${{ env.GCP_PROJECT_ID }}/${{ steps.env.outputs.env_name }}/collections/" 2>/dev/null \
              | sed -e 's|/$||' \
              | xargs -n1 basename \
              | python3 -c "import sys, json; print(json.dumps([u for u in sys.stdin.read().split() if u]))")
          fi
          echo "users=$users" >> $GITHUB_OUTPUT
          echo "Resolved users: $users"

  # ---------------------------------------------------------------------------
  # Render one user per matrix runner. Each runner pulls the prebuilt
  # reports image and invokes the renderer; output HTML is uploaded as
  # a per-user artifact for the deploy job to collect.
  # ---------------------------------------------------------------------------
  render-user:
    needs: discover
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
    if: ${{ needs.discover.outputs.users != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        user: ${{ fromJson(needs.discover.outputs.users) }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BGG_ML }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Pull reports image
        run: |
          docker pull us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:${{ needs.discover.outputs.image_tag }}

      - name: Render report
        run: |
          mkdir -p output
          docker run --rm \
            -v "$PWD/output:/out" \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/app/credentials/service-account-key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json \
            us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:${{ needs.discover.outputs.image_tag }} \
            --username "${{ matrix.user }}" \
            --source "gs://${{ env.GCP_PROJECT_ID }}/${{ needs.discover.outputs.env_name }}/collections" \
            --output-dir /out

      - name: Upload rendered HTML
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.user }}
          path: output/${{ matrix.user }}.html
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Collect every per-user HTML, mirror in HTMLs from the previous deploy
  # (so a partial render doesn't wipe absent users), build the index page,
  # and deploy the bundle to GitHub Pages. Also pushes the final bundle
  # back to gs://.../reports/ as a backing copy for the next run.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [discover, render-user]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BGG_ML }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Make output dir
        run: mkdir -p reports/_output

      # Seed with the previously deployed bundle so users who weren't
      # part of this run keep their last-published HTML.
      - name: Restore previously published HTMLs from GCS
        run: |
          gsutil -m rsync -r \
            "gs://${{ env.GCP_PROJECT_ID }}/${{ needs.discover.outputs.env_name }}/reports/" \
            reports/_output/ 2>&1 || echo "(no prior bundle in gs://; first run)"

      - name: Download per-user artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: report-*
          merge-multiple: true

      - name: Move per-user HTMLs into output dir
        run: |
          if [ -d artifacts ]; then
            cp artifacts/*.html reports/_output/ 2>/dev/null || true
          fi
          ls -la reports/_output/

      - name: Pull reports image
        run: |
          docker pull us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:${{ needs.discover.outputs.image_tag }}

      - name: Render index page
        run: |
          docker run --rm \
            -v "$PWD/reports/_output:/out" \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/app/credentials/service-account-key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json \
            --entrypoint python \
            us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/bgg-predictive-models/reports:${{ needs.discover.outputs.image_tag }} \
            -m reports.build_index \
            --source "gs://${{ env.GCP_PROJECT_ID }}/${{ needs.discover.outputs.env_name }}/collections" \
            --output-dir /out

      # Push the final bundle back to gs:// so the next run can seed
      # from it. This is what makes partial renders safe.
      - name: Mirror final bundle to GCS
        run: |
          gsutil -m rsync -r reports/_output/ \
            "gs://${{ env.GCP_PROJECT_ID }}/${{ needs.discover.outputs.env_name }}/reports/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/_output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
